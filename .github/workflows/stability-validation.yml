name: Stability Validation

# Manually-triggered only (no push/PR trigger). Shards
# docs/superpowers/plans/2026-08-26-stability-reporting.md Task 3's validation
# study across parallel jobs instead of one long serial run, keeping
# n_bootstrap=100 per the approved charter
# (docs/superpowers/specs/2026-08-26-stability-reporting-charter.md Decision 1).
# See scripts/run_stability_validation_shard.py and
# scripts/aggregate_stability_validation.py for what each job computes.

on:
  workflow_dispatch: {}

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # well_powered (coefficient=0.7): actual replication, 5 chunks of 10 reps
          - mode: actual
            config_label: well_powered
            coefficient: "0.7"
            rep_start: 0
            rep_count: 10
          - mode: actual
            config_label: well_powered
            coefficient: "0.7"
            rep_start: 10
            rep_count: 10
          - mode: actual
            config_label: well_powered
            coefficient: "0.7"
            rep_start: 20
            rep_count: 10
          - mode: actual
            config_label: well_powered
            coefficient: "0.7"
            rep_start: 30
            rep_count: 10
          - mode: actual
            config_label: well_powered
            coefficient: "0.7"
            rep_start: 40
            rep_count: 10
          # marginal (coefficient=0.15): actual replication, 5 chunks of 10 reps
          - mode: actual
            config_label: marginal
            coefficient: "0.15"
            rep_start: 0
            rep_count: 10
          - mode: actual
            config_label: marginal
            coefficient: "0.15"
            rep_start: 10
            rep_count: 10
          - mode: actual
            config_label: marginal
            coefficient: "0.15"
            rep_start: 20
            rep_count: 10
          - mode: actual
            config_label: marginal
            coefficient: "0.15"
            rep_start: 30
            rep_count: 10
          - mode: actual
            config_label: marginal
            coefficient: "0.15"
            rep_start: 40
            rep_count: 10
          # well_powered: bootstrap stability, one shard per dataset (0-9)
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 0
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 1
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 2
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 3
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 4
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 5
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 6
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 7
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 8
          - mode: bootstrap
            config_label: well_powered
            coefficient: "0.7"
            dataset_index: 9
          # marginal: bootstrap stability, one shard per dataset (0-9)
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 0
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 1
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 2
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 3
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 4
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 5
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 6
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 7
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 8
          - mode: bootstrap
            config_label: marginal
            coefficient: "0.15"
            dataset_index: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run shard
        run: |
          python scripts/run_stability_validation_shard.py \
            --mode "${{ matrix.mode }}" \
            --config-label "${{ matrix.config_label }}" \
            --coefficient "${{ matrix.coefficient }}" \
            --rep-start "${{ matrix.rep_start || 0 }}" \
            --rep-count "${{ matrix.rep_count || 0 }}" \
            --dataset-index "${{ matrix.dataset_index || 0 }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.mode }}-${{ matrix.config_label }}-${{ matrix.rep_start || matrix.dataset_index }}
          path: result.json

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Aggregate shards into the study summary
        run: python scripts/aggregate_stability_validation.py shards | tee summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stability-validation-summary
          path: summary.txt
