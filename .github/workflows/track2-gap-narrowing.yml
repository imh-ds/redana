name: Track 2 Gap Narrowing

# Manually-triggered only (no push/PR trigger). Shards
# docs/superpowers/specs/2026-08-26-track2-gap-narrowing-addendum.md's
# characterization grid across parallel jobs. See
# scripts/run_track2_gap_narrowing_shard.py and
# scripts/aggregate_track2_gap_narrowing.py for what each job computes.

on:
  workflow_dispatch: {}

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: selected
            n_rows: 300
            coefficient: "0.15"
          - arm: control
            n_rows: 300
            coefficient: "0.15"
          - arm: selected
            n_rows: 300
            coefficient: "0.20"
          - arm: control
            n_rows: 300
            coefficient: "0.20"
          - arm: selected
            n_rows: 300
            coefficient: "0.7"
          - arm: control
            n_rows: 300
            coefficient: "0.7"
          - arm: selected
            n_rows: 500
            coefficient: "0.15"
          - arm: control
            n_rows: 500
            coefficient: "0.15"
          - arm: selected
            n_rows: 500
            coefficient: "0.20"
          - arm: control
            n_rows: 500
            coefficient: "0.20"
          - arm: selected
            n_rows: 500
            coefficient: "0.7"
          - arm: control
            n_rows: 500
            coefficient: "0.7"
          - arm: selected
            n_rows: 700
            coefficient: "0.15"
          - arm: control
            n_rows: 700
            coefficient: "0.15"
          - arm: selected
            n_rows: 700
            coefficient: "0.20"
          - arm: control
            n_rows: 700
            coefficient: "0.20"
          - arm: selected
            n_rows: 700
            coefficient: "0.7"
          - arm: control
            n_rows: 700
            coefficient: "0.7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run shard
        run: |
          python scripts/run_track2_gap_narrowing_shard.py \
            --arm "${{ matrix.arm }}" \
            --n-rows "${{ matrix.n_rows }}" \
            --coefficient "${{ matrix.coefficient }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.arm }}-n${{ matrix.n_rows }}-c${{ matrix.coefficient }}
          path: result.json

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Aggregate shards into the results table
        run: python scripts/aggregate_track2_gap_narrowing.py shards | tee summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: track2-gap-narrowing-summary
          path: |
            summary.txt
            scripts/track2_gap_narrowing_results.json
