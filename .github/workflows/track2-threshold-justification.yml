name: Track 2 Threshold Justification

# Manually-triggered only (no push/PR trigger). Shards
# docs/superpowers/specs/2026-08-26-track2-threshold-justification-charter.md's
# bracketing grid across parallel jobs. See
# scripts/run_track2_threshold_shard.py and
# scripts/aggregate_track2_threshold.py for what each job computes.

on:
  workflow_dispatch: {}
  # workflow_dispatch can only be invoked via API/CLI once a workflow file
  # exists on the repo's default branch. Scoped push trigger to fire it
  # directly from this branch instead; remove once this either merges or
  # moves to workflow_dispatch-only.
  push:
    branches:
      - codex/batch-null-calibration

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: sensitive
            n_rows: 125
            coefficient: "0.2"
          - arm: normal
            n_rows: 125
            coefficient: "0.2"
          - arm: sensitive
            n_rows: 150
            coefficient: "0.2"
          - arm: normal
            n_rows: 150
            coefficient: "0.2"
          - arm: sensitive
            n_rows: 175
            coefficient: "0.2"
          - arm: normal
            n_rows: 175
            coefficient: "0.2"
          - arm: sensitive
            n_rows: 200
            coefficient: "0.2"
          - arm: normal
            n_rows: 200
            coefficient: "0.2"
          - arm: sensitive
            n_rows: 225
            coefficient: "0.2"
          - arm: normal
            n_rows: 225
            coefficient: "0.2"
          - arm: sensitive
            n_rows: 250
            coefficient: "0.2"
          - arm: normal
            n_rows: 250
            coefficient: "0.2"
          - arm: sensitive
            n_rows: 275
            coefficient: "0.2"
          - arm: normal
            n_rows: 275
            coefficient: "0.2"
          - arm: sensitive
            n_rows: 125
            coefficient: "0.7"
          - arm: normal
            n_rows: 125
            coefficient: "0.7"
          - arm: sensitive
            n_rows: 150
            coefficient: "0.7"
          - arm: normal
            n_rows: 150
            coefficient: "0.7"
          - arm: sensitive
            n_rows: 175
            coefficient: "0.7"
          - arm: normal
            n_rows: 175
            coefficient: "0.7"
          - arm: sensitive
            n_rows: 200
            coefficient: "0.7"
          - arm: normal
            n_rows: 200
            coefficient: "0.7"
          - arm: sensitive
            n_rows: 225
            coefficient: "0.7"
          - arm: normal
            n_rows: 225
            coefficient: "0.7"
          - arm: sensitive
            n_rows: 250
            coefficient: "0.7"
          - arm: normal
            n_rows: 250
            coefficient: "0.7"
          - arm: sensitive
            n_rows: 275
            coefficient: "0.7"
          - arm: normal
            n_rows: 275
            coefficient: "0.7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run shard
        run: |
          python scripts/run_track2_threshold_shard.py \
            --arm "${{ matrix.arm }}" \
            --n-rows "${{ matrix.n_rows }}" \
            --coefficient "${{ matrix.coefficient }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.arm }}-n${{ matrix.n_rows }}-c${{ matrix.coefficient }}
          path: result.json

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Aggregate shards into the classification table
        run: python scripts/aggregate_track2_threshold.py shards | tee summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: track2-threshold-summary
          path: |
            summary.txt
            scripts/track2_threshold_results.json
